<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1730">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<title>Panel · FORJA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="js/vendor/qrcode-generator.js"></script>
<style>
/* Layout: panel de operación; barra lateral en escritorio, pestañas deslizables arriba en móvil. Misma identidad que la app de miembros. */
:root{
  --bg:#EDF0F7; --surface:#FFFFFF; --surface-2:#F5F7FC; --ink:#0D1730; --muted:#5A6580; --line:#D6DCE9;
  --accent:#2143F0; --accent-ink:#FFFFFF; --accent-soft:#E2E7FE; --hi:#FFD23F; --hi-ink:#231A00;
  --good:#0E8A5B; --good-bg:#DDF4EA; --warn:#A86200; --warn-bg:#FFF0D6; --bad:#C23B22; --bad-bg:#FDE3DD; --info-bg:#E2E7FE;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --shadow:0 1px 0 rgba(13,23,48,.04),0 8px 24px -12px rgba(13,23,48,.18);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#080E1D; --surface:#111A2F; --surface-2:#0D152A; --ink:#EEF2FF; --muted:#94A1C0; --line:#243050;
  --accent:#6680FF; --accent-ink:#06102E; --accent-soft:#1B2650; --hi:#FFD23F; --hi-ink:#231A00;
  --good:#3DD39A; --good-bg:#0F3326; --warn:#FFB547; --warn-bg:#3A2A0C; --bad:#FF7A61; --bad-bg:#3D1A14; --info-bg:#1B2650;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#080E1D; --surface:#111A2F; --surface-2:#0D152A; --ink:#EEF2FF; --muted:#94A1C0; --line:#243050;
  --accent:#6680FF; --accent-ink:#06102E; --accent-soft:#1B2650; --hi:#FFD23F; --hi-ink:#231A00;
  --good:#3DD39A; --good-bg:#0F3326; --warn:#FFB547; --warn-bg:#3A2A0C; --bad:#FF7A61; --bad-bg:#3D1A14; --info-bg:#1B2650;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.01em;line-height:.95;margin:0;text-wrap:balance}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

.app{display:grid;min-height:100%;grid-template-columns:minmax(0,1fr)}
.side,.main{min-width:0}
@media(min-width:1000px){.app{grid-template-columns:240px minmax(0,1fr)}}
.side{background:var(--ink);color:var(--bg);padding:18px 14px;display:flex;flex-direction:column;gap:18px}
@media(min-width:1000px){.side{position:sticky;top:0;height:100vh;overflow:auto}}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:900;font-size:24px;transform:skewX(-8deg);flex:none}
.brand b{font-family:var(--f-display);font-weight:900;font-size:22px;line-height:1;display:block;letter-spacing:.02em}
.brand small{display:block;font-size:12px;opacity:.7;line-height:1.2}
.nav{display:flex;gap:4px}
@media(max-width:999px){.side{position:sticky;top:0;z-index:20;padding:12px 16px 8px}.nav{overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}.nav::-webkit-scrollbar{display:none}.side .foot{display:none}}
@media(min-width:1000px){.nav{flex-direction:column}}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:inherit;opacity:.72;padding:10px 12px;border-radius:10px;font-weight:600;white-space:nowrap;text-align:left}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{opacity:1;background:rgba(255,255,255,.06)}
.nav button[aria-current="page"]{opacity:1;background:var(--accent);color:#fff}
.navapp{display:flex;align-items:center;gap:10px;color:var(--hi);text-decoration:none;background:none;cursor:pointer;font:inherit;font-weight:700;padding:10px 12px;border-radius:10px;white-space:nowrap;border:1px dashed rgba(255,210,63,.5)}
.navapp svg{width:18px;height:18px;flex:none}
.navapp:hover{background:rgba(255,210,63,.1)}
@media(min-width:1000px){.navapp{margin-top:10px}}
.nav .count{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
.side .foot{margin-top:auto;font-size:12px;opacity:.7;display:grid;gap:8px}
.side .foot a{color:inherit}

.main{min-width:0;padding-inline:16px;padding-block:16px 60px}
@media(min-width:1000px){.main{padding-inline:28px;padding-block:24px 60px}}
.wrap{max-width:1200px;margin:0 auto;display:grid;gap:16px}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.pagehead h1{font-size:clamp(36px,6vw,54px);font-weight:900}
.demo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--accent-soft);border:1px dashed var(--accent);border-radius:12px;padding:8px 14px;font-size:13px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
.card-h h3{font-size:24px;font-weight:800}
.grid{display:grid;gap:16px}
.g2{display:grid;gap:16px}
@media(min-width:900px){.g2{grid-template-columns:1fr 1fr}.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:2px;min-width:0}
.kpi b{font-family:var(--f-display);font-weight:900;font-size:clamp(34px,5vw,46px);line-height:1}
.kpi .d{font-size:12px;color:var(--muted)}
.kpi.alert{background:var(--bad-bg);border-color:transparent}
.kpi.alert b{color:var(--bad)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:11px;padding:11px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);font-size:14px;text-decoration:none;white-space:nowrap}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.hi{background:var(--hi);color:var(--hi-ink)}
.btn.wa{background:#1FA855;color:#fff}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-family:var(--f-mono);margin-left:4px;opacity:.75}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.activo{background:var(--good-bg);color:var(--good)}
.pill.riesgo{background:var(--warn-bg);color:var(--warn)}
.pill.inactivo,.pill.vencido{background:var(--bad-bg);color:var(--bad)}
.pill.nuevo{background:var(--info-bg);color:var(--accent)}
.inp{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.f{display:grid;gap:5px;font-weight:600;font-size:14px}
.search{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:0 12px;flex:1;min-width:200px}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:10px 0;outline:none}

.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:13px;flex:none}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{display:block;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--muted);font-size:12px}
.list{display:grid}
.li{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.li>.who{flex:1 1 190px}
.li>.chips,.li>.btn,.li>.pill{flex:none}
.li:first-child{border-top:0}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:820px}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);font-weight:600}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}

/* charts */
.chart svg{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line)} .chart text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.chart .bar{fill:var(--accent)} .chart .bar.today{fill:var(--ink)}
.chart .hit{fill:transparent}
.chart .hit:hover + .bar,.chart .bar:hover{opacity:.8}
.heat{display:grid;grid-template-columns:34px repeat(18,1fr);gap:3px;font-family:var(--f-mono);font-size:10px;color:var(--muted);min-width:520px}
.heat .c{aspect-ratio:1;border-radius:4px}
.heat .hl{text-align:center}
.legend-grad{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.legend-grad i{width:120px;height:10px;border-radius:4px;background:linear-gradient(90deg,var(--surface-2),var(--accent))}
#tip{position:fixed;z-index:90;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;padding:6px 10px;border-radius:8px;box-shadow:var(--shadow);white-space:nowrap}

/* QR y recepción */
.qrbox{background:#fff;border-radius:16px;padding:14px;display:inline-grid;place-items:center;border:1px solid var(--line)}
.qrbox img,.qrbox canvas{display:block;max-width:100%;height:auto}
.kiosk{position:fixed;inset:0;z-index:80;background:#0A1230;color:#fff;overflow:auto;padding:64px 16px 24px;display:grid;gap:20px;align-content:start}
@media(min-width:900px){.kiosk{grid-template-columns:1.1fr 1fr;align-content:center;padding:70px 40px 40px}}
.kclose{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:81;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font-weight:700;font-size:14px;padding:9px 14px;border-radius:999px;cursor:pointer}
.kclose:hover{background:rgba(255,255,255,.2)}
.kiosk h1{font-size:clamp(44px,8vw,96px);font-weight:900;color:var(--hi)}
.kiosk .clock{font-family:var(--f-mono);font-size:22px;opacity:.8}
.kiosk .feed{display:grid;gap:8px}
.kiosk .fi{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.07);border-radius:14px;padding:12px 14px;animation:pop .4s ease-out}
.kiosk .fi b{font-size:18px}
.kiosk .fi.new{background:var(--hi);color:var(--hi-ink)}
@keyframes pop{from{transform:translateY(-10px);opacity:0}}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(5,10,25,.55);z-index:70;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:760px){.scrim{align-items:center;padding:24px}}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
@media(min-width:760px){.sheet{border-radius:20px}}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.sheet h2{font-size:36px;font-weight:900}
.iconbtn{background:none;border:0;color:var(--muted);padding:6px;border-radius:8px;display:inline-grid;place-items:center}
.mcal{max-width:340px}
.mcal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.mcal-h b{font-family:var(--f-display);font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.mcal-h .iconbtn{font-size:22px;line-height:1;width:34px;height:34px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
.mcal-h .iconbtn:disabled{opacity:.3;cursor:default}
.mcal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mcal-g .wd{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;padding-bottom:2px}
.mcal-g .cd{aspect-ratio:1;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-family:var(--f-mono);font-size:13px;color:var(--ink);padding:0;cursor:pointer}
.mcal-g button.cd:hover{border-color:var(--accent)}
.mcal-g .cd.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.mcal-g .cd.today{outline:2px solid var(--hi);outline-offset:1px}
.mcal-g .cd.fut{opacity:.35;cursor:default;background:transparent}
.cal{display:grid;grid-template-columns:18px repeat(9,1fr);gap:4px;max-width:380px;align-items:center}
.cal .cl{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.cal i,.cal button{aspect-ratio:1;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);padding:0;cursor:pointer}
.cal button:hover{border-color:var(--accent)}
.cal .on{background:var(--accent);border-color:var(--accent)}
.cal .today{outline:2px solid var(--hi);outline-offset:1px}
.cal i.fut{opacity:.25;cursor:default}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.mini b{display:block;font-family:var(--f-display);font-size:30px;line-height:1;font-weight:900}
.bar{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.plans{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.plan{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface-2);display:grid;gap:4px}
.plan>b{font-family:var(--f-display);font-size:30px;font-weight:900;line-height:1}
.dayb{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;background:var(--surface-2)}
.exrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;font-size:14px}
.addrow{display:grid;grid-template-columns:1fr 64px 80px auto;gap:6px}
@media(max-width:520px){.addrow{grid-template-columns:1fr 1fr}.addrow select{grid-column:1/-1}}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:12px;border:3px solid transparent}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.phone{width:100%;max-width:300px;margin:0 auto;border:10px solid var(--ink);border-radius:36px;background:#EDF0F7;overflow:hidden;color:#0D1730}
.phone .ph-top{display:flex;align-items:center;gap:8px;padding:12px}
.phone .ph-hero{margin:0 10px 10px;border-radius:16px;padding:16px;color:#fff}
.phone .ph-hero h4{font-family:var(--f-display);font-size:30px;line-height:.95;margin:4px 0;text-transform:uppercase}
.phone .ph-card{margin:0 10px 10px;background:#fff;border-radius:12px;padding:12px;font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:95;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.plan.pick{text-align:left;cursor:pointer;font:inherit;color:inherit}
.plan.pick:hover{border-color:var(--accent)}
.plan.pick[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.plan.newp{border-style:dashed;align-content:center;justify-items:start}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg2 button{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px;text-align:left}
.seg2 button small{display:block;color:var(--muted);font-size:12px}
.seg2 button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
@media(max-width:999px){.side .foot{display:none!important}}
.li .num{white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.planban{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--hi);color:var(--hi-ink);border-radius:14px;padding:12px 16px;margin-bottom:14px;font-size:14px}
.ptable th small{display:block;font-weight:500;color:var(--muted);font-size:12px;text-transform:none;letter-spacing:0}
.ptable td:not(:first-child),.ptable th:not(:first-child){text-align:center}
.ptable .cur{background:var(--accent-soft,rgba(33,67,240,.08))}
.adminlink{display:none;color:inherit;font-size:13px;font-weight:700;opacity:.85;padding:6px 0 0}
@media(max-width:999px){.adminlink{display:block}}
@media(max-width:600px){.ptable{min-width:0!important;font-size:13px}.ptable td,.ptable th{padding:8px 5px}.ptable .btn{white-space:normal;padding:6px 7px;font-size:12px;line-height:1.2}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo" id="bLogo">F</div><div><b id="bName">FORJA</b><small id="bSede">Panel del gimnasio</small></div></div>
    <nav class="nav" id="nav" aria-label="Secciones del panel"></nav>
    <div class="foot">
      <span id="whoami"></span>
    </div>
  </aside>
  <main class="main"><div class="wrap" id="view"></div></main>
</div>
<div id="modalRoot"></div>
<div id="tip" hidden></div>

<script>
/* ===================== CATÁLOGOS ===================== */
const DEF_PLANS=[
 {id:'diario',n:'Pase diario',tipo:'tiempo',days:1,price:10000,on:true},
 {id:'semanal',n:'Semanal',tipo:'tiempo',days:7,price:40000,on:true},
 {id:'tiquetera10',n:'Tiquetera 10 entradas',tipo:'entradas',entries:10,days:60,price:85000,on:true},
 {id:'mensual',n:'Mensual',tipo:'tiempo',days:30,price:120000,on:true},
 {id:'estudiante',n:'Estudiante',tipo:'tiempo',days:30,price:90000,on:true},
 {id:'trimestral',n:'Trimestral',tipo:'tiempo',days:90,price:320000,on:true},
 {id:'anual',n:'Anual',tipo:'tiempo',days:365,price:1150000,on:true}];
const DEF_METHODS=[{id:'efectivo',n:'Efectivo',on:true},{id:'nequi',n:'Nequi',on:true},{id:'daviplata',n:'Daviplata',on:true},{id:'transferencia',n:'Transferencia',on:true},{id:'tarjeta',n:'Tarjeta',on:true}];
let PLANS={};
let TRAINERS=[];
const TEAM_COLORS=['#E4572E','#17A398','#8E44AD','#D98E04','#2E86DE','#27AE60'];

let D={ready:false,v:2,plans:[],methods:[],brand:{name:'',sede:'',color:'#2143F0',welcome:''},code:'',owner:'',sus:null,created:null,members:[],pays:[],customProgs:[],retos:[],team:[]};

const SK={m:{},v:{},p:{},c:{},r:{},gym:''};
const clean=o=>JSON.parse(JSON.stringify(o));
const memberCore=m=>{const {visits,...r}=m;return JSON.stringify(r)};
const gymCore=()=>JSON.stringify({name:D.brand.name,sede:D.brand.sede||'',color:D.brand.color,welcome:D.brand.welcome||'',plans:D.plans,methods:D.methods});
const ROLE_SEC={dueno:['resumen','miembros','asistencia','membresias','programas','entrenadores','marca','plan'],recepcion:['resumen','miembros','asistencia','membresias','programas'],entrenador:['miembros','asistencia','programas']};

/* Guarda en Firestore solo lo que cambió desde la última sincronización */
function save(){
  syncPlans(); if(!SYNC) return;
  const {F,gid}=SYNC, {doc,setDoc,updateDoc,deleteDoc,serverTimestamp}=F.fs, g=(...p)=>doc(F.db,'gimnasios',gid,...p);
  const gc=gymCore(); if(gc!==SK.gym){ SK.gym=gc; if(isOwnerRole()) updateDoc(doc(F.db,'gimnasios',gid),JSON.parse(gc)).catch(fail); }
  const live=new Set();
  D.members.forEach(m=>{
    const c=memberCore(m);
    if(SK.m[m.id]!==c){ const isNew=SK.m[m.id]===undefined; SK.m[m.id]=c; const {visits,id,uid,created,...data}=m;
      if(isNew) setDoc(g('miembros',m.id),{...clean(data),uid:null,created:serverTimestamp()}).catch(fail);
      else updateDoc(g('miembros',m.id),clean(data)).catch(fail); }
    (m.visits||[]).forEach(v=>{ if(!v.id) v.id=m.id+'_'+v.d; live.add(v.id);
      if(!SK.v[v.id]){ SK.v[v.id]=1; (VIS[m.id]=VIS[m.id]||[]).push(v);
        setDoc(g('asistencias',v.id),{...clean({m:m.id,d:v.d,h:v.h,t:v.t??null,via:v.via||'manual',by:SYNC.uid}),ts:serverTimestamp()}).catch(fail); } });
  });
  Object.keys(SK.v).forEach(k=>{ if(!live.has(k)){ delete SK.v[k]; const mid=k.slice(0,k.lastIndexOf('_')); if(VIS[mid]) VIS[mid]=VIS[mid].filter(v=>v.id!==k); deleteDoc(g('asistencias',k)).catch(fail); } });
  D.pays.forEach(p=>{ if(!p.id){ p.id=F.newId('gimnasios',gid,'pagos'); SK.p[p.id]=1; const {id,...data}=p; setDoc(g('pagos',p.id),{...clean({...data,by:SYNC.uid}),ts:serverTimestamp()}).catch(fail); } });
  D.customProgs.forEach(p=>{ const c=JSON.stringify(p); if(SK.c[p.id]!==c){ SK.c[p.id]=c; const {id,...data}=p; setDoc(g('programas',p.id),clean(data)).catch(fail); } });
  D.retos.forEach(r=>{ const c=JSON.stringify(r); if(SK.r[r.id]!==c){ SK.r[r.id]=c; const {id,...data}=r; setDoc(g('retos',r.id),clean(data)).catch(fail); } });
}
/* Mezcla documentos en objetos existentes para no romper referencias abiertas */
function mergeById(arr,docs){ const by=new Map(arr.map(x=>[x.id,x])); return docs.map(d=>{ const data={id:d.id,...d.data()}; const cur=by.get(d.id); if(!cur) return data; Object.keys(cur).forEach(k=>{ if(!(k in data)&&k!=='visits') delete cur[k]; }); return Object.assign(cur,data); }); }
function attachVisits(){ D.members.forEach(m=>{ m.visits=(VIS[m.id]||[]).slice().sort((a,b)=>a.d.localeCompare(b.d)); }); }
let rTimer=null, pendingRender=false;
function scheduleRender(){ clearTimeout(rTimer); rTimer=setTimeout(()=>{ if(!D.ready) return; const a=document.activeElement;
  if(a&&a.closest&&a.closest('#view')&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.id!=='mq'){ pendingRender=true; return; }
  render(); if(window.kioskRedraw) window.kioskRedraw(); },60); }
document.addEventListener('focusout',()=>{ if(pendingRender){ pendingRender=false; setTimeout(scheduleRender,80); } });
function ensureQR(){ if(!SYNC) return; const {F,gid}=SYNC; QR_K=F.makeCode(10); F.fs.setDoc(F.fs.doc(F.db,'gimnasios',gid,'privado','qr'),{d:TODAY,k:QR_K,by:SYNC.uid}).catch(fail); }
async function boot(){
  const F=await import('./js/fb.js');
  let ses; try{ ses=await F.session(['dueno','recepcion','entrenador']); }catch(e){ return; }
  const {profile,gym,user}=ses, gid=gym.id;
  SYNC={F,gid,uid:user.uid,rol:profile.rol,name:profile.n||'',email:profile.email||''};
  if(!allowedSec(sec)) sec=ROLE_SEC[SYNC.rol][0];
  $('#whoami').textContent=(SYNC.name||SYNC.email)+' · '+ROLE_NAME[SYNC.rol];
  if(F.isAdminEmail(SYNC.email)){ const a=document.createElement('a'); a.href='admin.html'; a.textContent='Administración FORJA →'; a.style.fontWeight='700'; $('.side .foot').append(a); const b=document.createElement('a'); b.href='admin.html'; b.className='adminlink'; b.textContent='Admin FORJA'; $('#nav').after(b); }
  const {doc,collection,query,where,onSnapshot}=F.fs, col=(...p)=>collection(F.db,'gimnasios',gid,...p);
  const need=['gym','miembros','asistencias','programas','retos','equipo'].concat(isFrontRole()?['pagos']:[]), got=new Set();
  const ready=k=>{ got.add(k); if(!D.ready&&need.every(x=>got.has(x))) D.ready=true; scheduleRender(); };
  const bad=e=>{ fail(e); };
  onSnapshot(doc(F.db,'gimnasios',gid),sn=>{ const x=sn.data()||{}; D.brand={name:x.name||'Mi gimnasio',sede:x.sede||'',color:x.color||'#2143F0',welcome:x.welcome||''}; D.plans=x.plans||[]; D.methods=x.methods||[]; D.code=x.code||''; D.owner=x.owner||''; D.sus=x.sus||null; D.created=x.created||null; syncPlans(); SK.gym=gymCore(); buildTrainers(); ready('gym'); },bad);
  onSnapshot(col('miembros'),qs=>{ D.members=mergeById(D.members,qs.docs); attachVisits(); SK.m={}; D.members.forEach(m=>SK.m[m.id]=memberCore(m)); ready('miembros'); },bad);
  onSnapshot(query(col('asistencias'),where('d','>=',dkey(dayAt(120)))),qs=>{ VIS={}; SK.v={}; qs.docs.forEach(d=>{ const v={id:d.id,...d.data()}; (VIS[v.m]=VIS[v.m]||[]).push(v); SK.v[d.id]=1; }); attachVisits(); ready('asistencias'); },bad);
  if(isFrontRole()) onSnapshot(query(col('pagos'),where('d','>=',dkey(dayAt(400)))),qs=>{ D.pays=qs.docs.map(d=>({id:d.id,...d.data()})); D.pays.forEach(p=>SK.p[p.id]=1); ready('pagos'); },bad);
  onSnapshot(col('programas'),qs=>{ D.customProgs=qs.docs.map(d=>({id:d.id,...d.data()})); SK.c={}; D.customProgs.forEach(p=>SK.c[p.id]=JSON.stringify(p)); ready('programas'); },bad);
  onSnapshot(col('retos'),qs=>{ D.retos=qs.docs.map(d=>({id:d.id,...d.data()})); SK.r={}; D.retos.forEach(r=>SK.r[r.id]=JSON.stringify(r)); ready('retos'); },bad);
  onSnapshot(col('equipo'),qs=>{ D.team=qs.docs.map(d=>({id:d.id,...d.data()})); buildTrainers(); ready('equipo'); },bad);
  onSnapshot(doc(F.db,'gimnasios',gid,'privado','qr'),sn=>{ const x=sn.data(); if(x&&x.d===TODAY) QR_K=x.k; else ensureQR(); const q=document.getElementById('qr'); if(q) drawQR(q,220); if(window.kioskRedraw) window.kioskRedraw(); },bad);
}

function streak(m){ const set=new Set(m.visits.map(v=>v.d)); let n=0,i=set.has(TODAY)?0:1; while(set.has(dkey(dayAt(i)))){n++;i++} return n }

    return `<path class="bar ${x.k===TODAY?'today':''}" d="M${x0} ${H-pb} V${y+4} Q${x0} ${y} ${x0+4} ${y} H${x0+w-4} Q${x0+w} ${y} ${x0+w} ${y+4} V${H-pb} Z"/><rect class="hit" x="${pl+i*bw}" y="0" width="${bw}" height="${H-pb}" data-tip="${lbl}: ${x.v} visitas"/><text x="${x0+w/2}" y="${H-8}" text-anchor="middle">${x.d.getDate()}</text>`}).join('');
  // horas pico (últimos 28 días)

  let peak=['',0]; Object.entries(hm).forEach(([k,v])=>{if(v>peak[1])peak=[k,v]}); const [pw,ph]=peak[0]?peak[0].split('-'):[null,null];

  </div>
  <div class="g2 g21">

let calOff=0, calFor=null;
function monthCal(m,off){

function qrText(){ return 'FORJA|'+(SYNC?SYNC.gid:'')+'|'+QR_K }
function drawQR(el,size){

    if(qrcode.stringToBytesFuncs&&qrcode.stringToBytesFuncs['UTF-8']) qrcode.stringToBytes=qrcode.stringToBytesFuncs['UTF-8'];
    const q=qrcode(0,'M'); q.addData(qrText()); q.make(); const n=q.getModuleCount(); let d='';
    for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(q.isDark(r,c)) d+=`M${c} ${r}h1v1h-1z`;

     ${r.length?`<div style="font-size:13px"><b>Por contactar:</b> ${r.slice(0,4).map(m=>`<button class="chip" data-m="${m.id}">${esc(m.n)}</button>`).join(' ')}</div>`:''}`:''}
     <div class="chips">${t.uid?'':`<button class="btn sm wa" data-inv="${esc(t.id)}">Copiar invitación</button>`}<button class="btn sm ghost" data-rm="${esc(t.id)}">Quitar del equipo</button></div></div>`; };
  $('#view').innerHTML=`${head('Equipo',T.length+(T.length===1?' persona':' personas'))}
  <div class="card"><div class="card-h"><h3>Invitar al equipo</h3></div>
    <form id="tf" class="g2" style="align-items:end">
      <label class="f">Nombre<input class="inp" id="tN" required maxlength="40" placeholder="Ej. Natalia Gómez"></label>
      <label class="f">Correo<input class="inp" id="tE" type="email" required maxlength="80" placeholder="correo@ejemplo.com"></label>
      <label class="f">Rol<select class="inp" id="tR"><option value="recepcion">Recepción: cobra, registra entradas e inscribe miembros</option><option value="entrenador">Entrenador: sus miembros, programas y notas</option></select></label>
      <button class="btn" type="submit">Invitar</button>
    </form>
    <p class="muted" style="font-size:13px;margin:10px 0 0">La persona entra a ${esc(appUrl())}, toca Crear cuenta y usa el código <b class="num">${esc(D.code)}</b> con ese mismo correo.</p></div>
  ${T.length?`<div class="g2">${T.map(card).join('')}</div>`:'<div class="empty">Aún no has invitado a nadie. Tu equipo no ve ingresos ni puede cambiar precios.</div>'}`;
  bindCommon(e=>{ const inv=e.target.closest('[data-inv]'), rm=e.target.closest('[data-rm]'); if(!inv&&!rm) return false;
    const t=D.team.find(x=>x.id===(inv||rm).dataset[inv?'inv':'rm']);
    if(inv){ copy(`Hola ${String(t.n).split(' ')[0]} 👋 Te invito al equipo de ${D.brand.name} en FORJA como ${ROLE_NAME[t.rol].toLowerCase()}. Entra a ${appUrl()} → Crear cuenta → código *${D.code}*, con el correo ${t.email}.`,'Invitación copiada'); return true }
    modal(`<h2 style="font-size:30px">¿Quitar a ${esc(t.n)}?</h2><p class="muted">Perderá el acceso al panel. Sus miembros asignados quedan sin entrenador.</p><div class="chips"><button class="btn" id="doRm">Quitar</button><button class="btn ghost" data-close>Cancelar</button></div>`,
      sc=>sc.querySelector('#doRm').onclick=async()=>{ const {F,gid}=SYNC; try{ if(t.uid) await F.fs.deleteDoc(F.fs.doc(F.db,'usuarios',t.uid)); await F.fs.deleteDoc(F.fs.doc(F.db,'gimnasios',gid,'equipo',t.id)); closeModal(); toast(t.n+' ya no está en el equipo'); }catch(err){ fail(err) } });
    return true });
  $('#tf').onsubmit=async ev=>{ ev.preventDefault(); const n=$('#tN').value.trim(), email=$('#tE').value.trim().toLowerCase(), rol=$('#tR').value; if(!n||!email) return;
    if(email===SYNC.email){ toast('Ese es tu propio correo'); return }
    const {F,gid}=SYNC; try{ await F.fs.setDoc(F.fs.doc(F.db,'gimnasios',gid,'equipo',email),{n,email,rol,uid:null,color:TEAM_COLORS[D.team.length%TEAM_COLORS.length],created:F.fs.serverTimestamp()}); toast('Invitación creada. Toca “Copiar invitación” para enviarla'); }catch(err){ fail(err) } };
}

/* ===================== MI MARCA ===================== */
function vMarca(){
  const b=D.brand;
  $('#view').innerHTML=`${head('Mi marca','así ven tus miembros la app')}
  <div class="g2">
    <div class="card grid" style="gap:14px">
      <label class="f">Nombre del gimnasio<input class="inp" id="bn" maxlength="28" value="${esc(b.name)}"></label>
      <label class="f">Sede<input class="inp" id="bs" maxlength="40" value="${esc(b.sede)}"></label>
      <div class="f"><span>Color de la marca</span><div class="swatches">${COLORS.map(([c,n])=>`<button class="sw" data-c="${c}" style="background:${c}" aria-pressed="${b.color===c}" aria-label="${n}" title="${n}"></button>`).join('')}</div></div>
      <label class="f">Mensaje de bienvenida<textarea class="inp" id="bw" rows="2" maxlength="120">${esc(b.welcome)}</textarea></label>
      <p class="muted" style="font-size:13px;margin:0">Los cambios se ven al instante en la app de todos tus miembros.</p>
      <hr style="border:0;border-top:1px solid var(--line);width:100%">
      <div class="plan"><span class="eyebrow">Código del gimnasio</span><b class="num" style="letter-spacing:.15em">${esc(D.code)}</b>
        <span class="muted" style="font-size:13px">Tus miembros y tu equipo lo usan para crear su cuenta en ${esc(appUrl())}</span>
        <button class="btn sm ghost" id="cpCode" style="justify-self:start;margin-top:6px">Copiar código y enlace</button></div>
    </div>
    <div class="card"><div class="eyebrow" style="text-align:center;margin-bottom:10px">Vista previa · app de miembros</div>
      <div class="phone"><div class="ph-top"><div class="logo" style="width:30px;height:30px;font-size:18px;background:${b.color}">${esc((b.name[0]||'F').toUpperCase())}</div><div><b style="font-family:var(--f-display);font-size:18px;line-height:1">${esc(b.name.toUpperCase())}</b><div style="font-size:11px;color:#5A6580">${esc(b.sede)}</div></div></div>
        <div class="ph-hero" style="background:${b.color}"><div style="font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;opacity:.8">HOLA, ATLETA</div><h4>No rompas<br>la racha</h4><div style="font-size:12px;opacity:.9">${esc(b.welcome)}</div><div style="margin-top:10px;display:inline-block;background:#FFD23F;color:#231A00;font-weight:700;font-size:12px;padding:7px 12px;border-radius:9px">Entrenar: Día B</div></div>
        <div class="ph-card"><div style="font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;color:#5A6580">RETO DEL GYM</div><b style="font-family:var(--f-display);font-size:20px;text-transform:uppercase">${esc(D.retos[0]?.n||'Reto del mes')}</b><div style="height:6px;background:#EDF0F7;border-radius:9px;margin-top:6px"><div style="width:62%;height:100%;background:${b.color};border-radius:9px"></div></div></div>
        <div class="ph-card" style="display:flex;justify-content:space-between"><span>Ranking ${esc(b.name)}</span><b>#1</b></div></div></div>
  </div>`;
  const up=()=>{ b.name=$('#bn').value.trim()||'Mi gimnasio'; b.sede=$('#bs').value.trim(); b.welcome=$('#bw').value.trim(); save(); };
  ['#bn','#bs','#bw'].forEach(s=>$(s).onchange=()=>{up();vMarca();nav()});
  $('#view').querySelectorAll('[data-c]').forEach(x=>x.onclick=()=>{b.color=x.dataset.c; save(); vMarca(); nav()});
  $('#cpCode').onclick=()=>copy(`Únete a ${b.name} en FORJA: ${appUrl()} → Crear cuenta → código ${D.code}`,'Código y enlace copiados');
}

render();
boot();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
