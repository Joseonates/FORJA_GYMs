<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2143F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>FORJA</title>
<script src="js/vendor/html5-qrcode.min.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: app de una columna en móvil con barra inferior; en escritorio, pestañas arriba y mapa + lista en dos columnas */
:root{
  --bg:#EDF0F7; --surface:#FFFFFF; --surface-2:#F5F7FC; --ink:#0D1730; --muted:#5A6580; --line:#D6DCE9;
  --accent:#2143F0; --accent-ink:#FFFFFF; --accent-soft:#E2E7FE;
  --hi:#FFD23F; --hi-ink:#231A00; --heat:#FF5A36; --good:#12A36B;
  --muscle:#C8D0E2; --muscle-hover:#9FB0DA; --body:#DDE2EE; --fig:#27324F; --eq:#0D1730; --prop:#C3CBDD;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px; --shadow:0 1px 0 rgba(13,23,48,.04),0 8px 24px -12px rgba(13,23,48,.18);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#080E1D; --surface:#111A2F; --surface-2:#0D152A; --ink:#EEF2FF; --muted:#94A1C0; --line:#243050;
  --accent:#6680FF; --accent-ink:#06102E; --accent-soft:#1B2650;
  --hi:#FFD23F; --hi-ink:#231A00; --heat:#FF6B4A; --good:#2BD08F;
  --muscle:#2A3656; --muscle-hover:#3E4E7C; --body:#1C2642; --fig:#C9D3EF; --eq:#EEF2FF; --prop:#2E3A5E;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#080E1D; --surface:#111A2F; --surface-2:#0D152A; --ink:#EEF2FF; --muted:#94A1C0; --line:#243050;
  --accent:#6680FF; --accent-ink:#06102E; --accent-soft:#1B2650;
  --hi:#FFD23F; --hi-ink:#231A00; --heat:#FF6B4A; --good:#2BD08F;
  --muscle:#2A3656; --muscle-hover:#3E4E7C; --body:#1C2642; --fig:#C9D3EF; --eq:#EEF2FF; --prop:#2E3A5E;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.memb{display:grid;gap:10px}
.memb .st{font-weight:600}
.memb .st.bad{color:var(--heat)}
.memb .ok{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--good)}
#qrReader video{border-radius:14px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:12px 110px}
h1,h2,h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.01em;line-height:.95;margin:0;text-wrap:balance}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* Header */
.top{display:flex;align-items:center;gap:12px;justify-content:space-between;padding-block:6px 14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-family:var(--f-display);font-weight:900;font-size:24px;transform:skewX(-8deg)}
.brand b{font-family:var(--f-display);font-weight:900;font-size:26px;letter-spacing:.02em;line-height:1}
.brand small{display:block;font-size:12px;color:var(--muted);line-height:1.1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13px;white-space:nowrap}
.pill.fire{background:var(--hi);color:var(--hi-ink);border-color:transparent}

/* Nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:6px 2px;border-radius:10px;font-size:11px;font-weight:600;color:var(--muted)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button[aria-current="page"] svg{stroke-width:2.4}
@media (min-width:900px){
  .nav{position:sticky;top:env(safe-area-inset-top,0px);bottom:auto;border:1px solid var(--line);border-radius:14px;max-width:1068px;margin:0 auto 16px;justify-content:flex-start;gap:4px;padding:6px}
  .nav button{flex:0 0 auto;flex-direction:row;gap:8px;font-size:14px;padding:8px 14px}
  .nav button[aria-current="page"]{background:var(--accent-soft)}
  .navholder{padding-inline:16px}
}

[hidden]{display:none!important}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);font-size:15px}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.hi{background:var(--hi);color:var(--hi-ink)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn:active{transform:translateY(1px)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.tag.l1{color:var(--good)} .tag.l2{color:var(--accent)} .tag.l3{color:var(--heat)}

.demo-banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);border:1px dashed var(--accent);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:14px}

/* HOY */
.hero{position:relative;overflow:hidden;background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:22px;display:grid;gap:14px}
.hero h1{font-size:clamp(40px,9vw,72px);font-weight:900}
.hero .streak{font-family:var(--f-display);font-weight:900;font-size:clamp(88px,20vw,150px);line-height:.8;color:var(--hi)}
.hero-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:18px;justify-content:space-between}
.hero .sub{font-weight:600;opacity:.92;max-width:34ch}
.hero .stripes{position:absolute;right:-40px;top:-20px;width:240px;height:240px;opacity:.14;background:repeating-linear-gradient(-45deg,currentColor 0 10px,transparent 10px 24px);border-radius:50%;pointer-events:none}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:grid;place-items:center;gap:4px;font-size:11px;font-weight:700;opacity:.9}
.day i{width:100%;max-width:40px;aspect-ratio:1;border-radius:10px;border:2px solid currentColor;opacity:.45;display:grid;place-items:center;font-style:normal}
.day.on i{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);opacity:1}
.day.today i{opacity:1;border-style:dashed}
.two{display:grid;gap:14px}
@media(min-width:760px){.two{grid-template-columns:1fr 1fr}}
.challenge h2{font-size:34px;font-weight:800}
.bar{height:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s}
.bar.hi>i{background:var(--hi)}

/* MAPA */
.map-layout{display:grid;gap:14px}
@media(min-width:900px){.map-layout{grid-template-columns:400px 1fr;align-items:start}.map-sticky{position:sticky;top:80px}}
.bodies{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bodies figure{margin:0;text-align:center}
.bodies figcaption{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
svg.body{width:100%;max-width:100%;height:auto;display:block}
svg.body .base{fill:var(--body)}
svg.body .m{fill:var(--muscle);stroke:var(--surface);stroke-width:1.6;transition:fill .18s}
svg.body.interactive .m{cursor:pointer}
svg.body.interactive .m:hover{fill:var(--muscle-hover)}
svg.body .m.sel{fill:var(--accent)}
svg.body .m.pri{fill:var(--accent)}
svg.body .m.sec{fill:color-mix(in srgb,var(--accent) 38%,var(--muscle))}
.search{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:12px 0;outline:none}
.sel-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sel-title h2{font-size:40px;font-weight:900}
.exlist{display:grid;gap:10px}
@media(min-width:620px){.exlist{grid-template-columns:1fr 1fr}}
.ex{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;width:100%}
.ex:hover{border-color:var(--accent)}
.ex .thumb{width:56px;height:56px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden}
.ex .thumb svg{width:54px;height:auto}
.ex b{display:block;font-size:15px;line-height:1.2}
.ex .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}

/* RUTINA */
.form-grid{display:grid;gap:16px}
.field label.lbl{display:block;font-weight:700;margin-bottom:8px}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.seg button{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px;text-align:left;font-weight:700;font-size:14px}
.seg button small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.plan{display:grid;gap:8px;counter-reset:p}
.plan-row{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.plan-row .n{font-family:var(--f-display);font-weight:900;font-size:26px;color:var(--accent)}
.plan-row b{display:block;line-height:1.2}
.plan-row .rx{font-family:var(--f-mono);font-size:13px;text-align:right;white-space:nowrap}
.iconbtn{background:none;border:0;color:var(--muted);padding:6px;border-radius:8px;display:inline-grid;place-items:center}
.iconbtn:hover{color:var(--heat)}

/* PROGRESO */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font-family:var(--f-display);font-weight:900;font-size:40px;line-height:1}
.lvl{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.lvl .badge-lvl{width:84px;height:84px;border-radius:22px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:44px;transform:rotate(-4deg)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.bdg{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2);text-align:center;display:grid;gap:6px;justify-items:center}
.bdg .ico{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--muscle);color:var(--muted);font-family:var(--f-display);font-weight:900;font-size:20px}
.bdg.got .ico{background:var(--hi);color:var(--hi-ink)}
.bdg b{font-size:13px;line-height:1.2}
.bdg small{font-size:11px;color:var(--muted);line-height:1.25}
.bdg:not(.got){opacity:.7}
.hist{display:grid;gap:8px}
.hrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hrow .d{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:62px}
.inp{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px}

/* RANKING */
.rank{display:grid;gap:6px}
.rrow{display:grid;grid-template-columns:40px 40px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.rrow.me{background:var(--hi);color:var(--hi-ink);border-color:transparent}
.rrow.me .muted{color:var(--hi-ink);opacity:.75}
.rrow .pos{font-family:var(--f-display);font-weight:900;font-size:26px;text-align:center}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:14px}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end;text-align:center}
.podium div{border-radius:12px 12px 0 0;background:var(--accent);color:var(--accent-ink);padding:10px 6px;display:grid;gap:4px;justify-items:center}
.podium div .av{border:3px solid var(--accent-ink)}
.podium b{font-size:13px;line-height:1.1}

/* Modal / sheet */
.scrim{position:fixed;inset:0;background:rgba(5,10,25,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@media(min-width:760px){.scrim{align-items:center;padding:24px}}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out}
@media(min-width:760px){.sheet{border-radius:20px}}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.sheet h2{font-size:38px;font-weight:900}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:32px 1fr;gap:10px;counter-increment:s}
.steps li::before{content:counter(s);width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-family:var(--f-mono)}
.tip{background:var(--hi);color:var(--hi-ink);border-radius:12px;padding:12px 14px;font-weight:600}
.fig{display:block;width:100%;height:auto}
.fig .sg{stroke:var(--fig);stroke-linecap:round}
.fig .sg.pri{stroke:var(--accent)} .fig .sg.sec{stroke:color-mix(in srgb,var(--accent) 45%,var(--fig))}
.fig .poly{fill:var(--fig);stroke:var(--fig);stroke-width:8;stroke-linejoin:round}
.fig .poly.pri{fill:var(--accent);stroke:var(--accent)} .fig .poly.sec{fill:color-mix(in srgb,var(--accent) 45%,var(--fig));stroke:color-mix(in srgb,var(--accent) 45%,var(--fig))}
.fig .head,.fig .hand{fill:var(--fig)} .fig .far{opacity:.35}
.fig .floor{stroke:var(--line);stroke-width:2} .fig .prop{fill:var(--prop)}
.fig .plate{fill:var(--eq)} .fig .hub{fill:var(--surface-2)} .fig .kbh{fill:none;stroke:var(--eq);stroke-width:2.5}
.fig .barl{stroke:var(--eq);stroke-width:3.5;stroke-linecap:round} .fig .cable{stroke:var(--muted);stroke-width:1.5}
.fig .band{stroke:var(--hi);stroke-width:3.5;stroke-linecap:round}
.demo-wrap{display:grid;gap:12px;margin-bottom:16px}
@media(min-width:600px){.demo-wrap{grid-template-columns:1.5fr 1fr;align-items:start}}
.demo{position:relative;background:var(--surface-2);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.demo .fig{aspect-ratio:224/210}
.demo .live{position:absolute;left:10px;top:10px;display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.demo .live i{width:8px;height:8px;border-radius:50%;background:var(--heat);animation:pulse 1.2s infinite}
.demo .phase{position:absolute;right:10px;top:10px;font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;color:var(--accent)}
.demo-bar{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap;padding:8px 10px;border-top:1px solid var(--line);background:var(--surface)}
.demo-side{display:grid;gap:10px}
.steps li{padding:6px;border-radius:10px;transition:background .2s}
.steps li.on{background:var(--accent-soft)}
.sx .mini{width:64px;flex:none;background:var(--surface-2);border:1px solid var(--line);border-radius:10px}
.yt{display:flex;align-items:center;justify-content:center;gap:10px;background:#E62117;color:#fff;font-weight:700;font-size:15px;text-decoration:none;padding:13px 16px}
.yt:hover{background:#C41A12}
.yt.sm{display:inline-flex;padding:8px 12px;font-size:13px;border-radius:10px}
.minimaps{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-width:220px}
@media(min-width:600px){.minimaps{max-width:none}}
.rtabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px}
.rtabs button{border:0;background:none;border-radius:10px;padding:10px;font-weight:700;color:var(--muted)}
.rtabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.quizban{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;background:var(--ink);color:var(--bg);border-radius:18px;padding:18px}
.quizban h2{font-size:34px;font-weight:900}
.quizban p{margin:.3em 0 0;opacity:.8;max-width:44ch}
.progs{display:grid;gap:14px}
@media(min-width:700px){.progs{grid-template-columns:1fr 1fr}}
@media(min-width:1000px){.progs{grid-template-columns:1fr 1fr 1fr}}
.prog{display:grid;gap:12px;align-content:start}
.prog h3{font-size:30px;font-weight:900}
.prog-top{display:flex;flex-wrap:wrap;gap:6px}
.prog-body{display:grid;grid-template-columns:1fr 64px;gap:12px;align-items:start}
.prog-map{width:64px}
.prog-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.prog-meta b{color:var(--ink);font-size:15px}
.tag.rec{background:var(--hi);color:var(--hi-ink);border-color:transparent}
.tag.act{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.pday{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pday-h{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 12px;background:var(--surface-2)}
.pday-h .n{font-family:var(--f-display);font-weight:900;font-size:24px;color:var(--accent)}
.pex{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;width:100%;border:0;border-top:1px solid var(--line);background:var(--surface);padding:8px 12px;text-align:left;font-weight:600}
.pex:hover{background:var(--surface-2)}
.pex .pfig{width:44px;height:40px;display:grid;place-items:center}
.pex .num{font-size:13px;white-space:nowrap}
.activeprog{display:grid;gap:12px;background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:18px}
.activeprog h2{font-size:36px;font-weight:900}
.activeprog .bar{background:rgba(255,255,255,.2);border-color:transparent}
.activeprog .bar>i{background:var(--hi)}
.daysrow{display:flex;flex-wrap:wrap;gap:6px}
.daysrow span{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid currentColor;opacity:.6}
.daysrow span.next{background:var(--hi);color:var(--hi-ink);border-color:var(--hi);opacity:1}
.backbtn{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px;padding:8px 14px 8px 10px;border-radius:999px;margin-bottom:12px}
.backbtn:hover{filter:brightness(.97)}
@keyframes pulse{50%{opacity:.3}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}

/* SESIÓN */
.session{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px)}
.session .wrap{padding-block:0 180px}
.sess-top{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.clock{font-family:var(--f-mono);font-size:22px;font-weight:600}
.sx{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.sx.done{border-color:var(--good)}
.sx h3{font-size:22px;font-weight:800;overflow-wrap:anywhere}
.sx .btn{flex:none}
.set{display:grid;grid-template-columns:30px 1fr 1fr 48px;gap:8px;align-items:center}
.set .i{font-family:var(--f-mono);color:var(--muted);text-align:center}
.set input{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px;text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.set .ok{height:44px;border-radius:10px;border:2px solid var(--line);background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.set.done .ok{background:var(--good);border-color:var(--good);color:#fff}
.set.done input{opacity:.6}
.sethead{display:grid;grid-template-columns:30px 1fr 1fr 48px;gap:8px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.rest{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:45;max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:14px;box-shadow:0 20px 40px -12px rgba(0,0,0,.5)}
.rest svg{width:62px;height:62px;flex:none}
.rest .t{font-family:var(--f-mono);font-size:28px;font-weight:600;line-height:1}
.rest .grow{flex:1;min-width:0}
.rest .btn{background:var(--bg);color:var(--ink)}
.finishbar{position:fixed;left:0;right:0;bottom:0;z-index:41;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.finishbar .btn{width:100%;max-width:560px;margin:0 auto;display:flex;padding:16px;font-size:17px}

/* Resumen */
.share-img{width:100%;max-width:360px;border-radius:16px;display:block;margin:0 auto;box-shadow:var(--shadow)}
.xpbig{font-family:var(--f-display);font-weight:900;font-size:80px;line-height:.9;color:var(--accent)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);animation:up .2s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  CTX.F.fs.updateDoc(CTX.F.fs.doc(CTX.F.db,'usuarios',CTX.uid),{app:JSON.parse(JSON.stringify(app)),n:S.name||''}).catch(err); },400); }
function weekKey(d){ const x=new Date(d); x.setHours(12,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return dkey(x); }
/* Guarda una sesión o reto terminado y actualiza tu fila del ranking */
function persistEntry(h){ if(!CTX) return; const {F,gid,mid,uid}=CTX, {doc,setDoc,serverTimestamp}=F.fs;
  const id=F.newId('gimnasios',gid,'miembros',mid,'sesiones'); h.id=id;
  setDoc(doc(F.db,'gimnasios',gid,'miembros',mid,'sesiones',id),JSON.parse(JSON.stringify(h))).catch(err);
  const wk=weekKey(Date.now()), xpWeek=S.history.filter(x=>weekKey(x.d)===wk).reduce((a,x)=>a+(x.xp||0),0);
  setDoc(doc(F.db,'gimnasios',gid,'ranking',mid),{uid,n:S.name||'Atleta',week:wk,xpWeek,xpTotal:totalXP(),lvl:levelOf(totalXP()),updated:serverTimestamp()}).catch(err);
  CTX.rank=null; }
function addCustomProg(id,c){ if(PROGI[id]) return; const p={id,l:c.l||1,n:c.n||'Programa del gimnasio',goal:'Programa del gimnasio',dpw:(c.days||[]).length,weeks:c.weeks||4,min:45,where:'gym',obj:[],custom:true,
  desc:'Programa creado por tu gimnasio.',prog:'Sube el peso cuando completes todas las repeticiones de todas las series.',
  days:(c.days||[]).map(d=>({n:d.n,x:(d.x||[]).filter(x=>EXI[x[0]]).map(([e,se,r])=>[e,se,r,60])}))}; if(!p.days.length) return; PROGS.push(p); PROGI[id]=p; }
function syncProg(id){ if(!CTX||!CTX.member||CTX.member.prog===id) return; CTX.F.fs.updateDoc(CTX.F.fs.doc(CTX.F.db,'gimnasios',CTX.gid,'miembros',CTX.mid),{prog:id}).catch(err); }
async function boot(){
  const F=await import('./js/fb.js'); let ses; try{ ses=await F.session(['miembro']); }catch(e){ return }
  const {user,profile,gym}=ses, gid=gym.id, mid=profile.memberId;
  CTX={F,uid:user.uid,gid,mid,gym,member:null,myVisits:[],retos:[],rank:null,rankAt:0};
  Object.assign(S,profile.app||{}); S.name=profile.n||S.name||'Atleta'; S.gym=gym.name||''; S.demo=false; S.history=[];
  if(gym.color&&gym.color.toLowerCase()!=='#2143f0') document.documentElement.style.setProperty('--accent',gym.color);
  const {doc,collection,query,where,orderBy,limit,getDocs,onSnapshot}=F.fs;
  try{
    const hs=await getDocs(query(collection(F.db,'gimnasios',gid,'miembros',mid,'sesiones'),orderBy('d','desc'),limit(400)));
    S.history=hs.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.d).localeCompare(String(b.d)));
    const ps=await getDocs(collection(F.db,'gimnasios',gid,'programas')); ps.docs.forEach(d=>addCustomProg(d.id,d.data()));
  }catch(e){ err(e) }
  onSnapshot(doc(F.db,'gimnasios',gid,'miembros',mid),sn=>{ CTX.member={id:sn.id,...sn.data()}; if(READY&&tab==='hoy') render(); },err);
  onSnapshot(doc(F.db,'gimnasios',gid),sn=>{ CTX.gym={id:sn.id,...sn.data()}; S.gym=CTX.gym.name||''; if(READY) header(); },err);
  onSnapshot(query(collection(F.db,'gimnasios',gid,'asistencias'),where('m','==',mid)),qs=>{ CTX.myVisits=qs.docs.map(d=>d.data()).sort((a,b)=>a.d.localeCompare(b.d)); if(READY&&tab==='hoy') render(); },err);
  onSnapshot(collection(F.db,'gimnasios',gid,'retos'),qs=>{ CTX.retos=qs.docs.map(d=>({id:d.id,...d.data()})); if(READY&&tab==='ranking') render(); },err);
  READY=true; render();
}
const totalXP = () => S.history.reduce((a,h)=>a+(h.xp||0),0);
const levelOf = xp => Math.floor((1+Math.sqrt(1+8*xp/150))/2);
const lvlStart = L => 150*L*(L-1)/2;
const rankName = L => L>=10?'Leyenda':L>=7?'Titán':L>=5?'Guerrero':L>=3?'Constante':'Novato';
function trainedDays(){ const s=new Set(S.history.filter(h=>h.sets>0||h.reto).map(h=>dkey(h.d))); if(CTX) CTX.myVisits.forEach(v=>s.add(v.d)); return s }
function streak(){
  const set=trainedDays(); let n=0; let i = set.has(today())?0:1;
  while(set.has(dkey(daysAgo(i)))){n++;i++}
  return n;
}
function weekHeat(){ const h={}; const cut=daysAgo(6); cut.setHours(0,0,0,0);
  S.history.filter(x=>new Date(x.d)>=cut).forEach(x=>(x.mus||[]).forEach(m=>h[m]=(h[m]||0)+1)); return h }
const fmt = n => Math.round(n).toLocaleString('es-CO');
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function copy(text){ const done=()=>toast('Copiado. Pégalo en WhatsApp o Instagram');
  try{ navigator.clipboard.writeText(text).then(done,()=>fallback()) }catch(e){fallback()}
  function fallback(){ const ta=document.createElement('textarea'); ta.value=text; document.body.append(ta); ta.select(); try{document.execCommand('copy');done()}catch(e){toast('Selecciona el texto y cópialo')} ta.remove() } }

const fdShort=k=>new Date(k+'T12:00').toLocaleDateString('es-CO',{day:'numeric',month:'short'}).replace(' de ',' ').replace('.','');
function myPlan(){ const m=CTX&&CTX.member; if(!m) return null; const p=((CTX.gym&&CTX.gym.plans)||[]).find(x=>x.id===m.plan)||{n:'Sin plan',tipo:'tiempo',days:30};
  const daily=p.tipo==='tiempo'&&p.days===1, ticket=p.tipo==='entradas', expIn=m.exp?Math.round((new Date(m.exp+'T12:00')-new Date(today()+'T12:00'))/864e5):-1;
  const vencido=!daily&&(expIn<0||(ticket&&(m.entries||0)<=0)), paidToday=daily&&m.exp===today();
  return {m,p,daily,ticket,expIn,vencido,paidToday}; }
function memberCard(){ const P=myPlan(); if(!P) return ''; const {m,p,daily,ticket,expIn,vencido,paidToday}=P;
  const inToday=CTX.myVisits.find(v=>v.d===today());
  const line=daily?(paidToday?'Pase de hoy pagado':'Pagas por día en recepción'):ticket?`${m.entries||0} ${m.entries===1?'entrada disponible':'entradas disponibles'} · hasta el ${fdShort(m.exp)}`:expIn<0?`Venció el ${fdShort(m.exp)}`:expIn===0?'Vence hoy':`Vence el ${fdShort(m.exp)} · faltan ${expIn} ${expIn===1?'día':'días'}`;
  const hh=inToday&&inToday.t!=null?String(Math.floor(inToday.t/60)).padStart(2,'0')+':'+String(inToday.t%60).padStart(2,'0'):'';
  return `<div class="card memb"><div class="sel-title"><div><div class="eyebrow">Tu membresía · ${esc(S.gym)}</div><h2 style="font-size:30px;font-weight:900">${esc(p.n)}</h2></div>${inToday?`<span class="ok">✓ Entraste hoy${hh?' a las '+hh:''}</span>`:''}</div>
    <span class="st ${vencido?'bad':''}">${line}</span>
    ${inToday?'':vencido?'<p class="muted" style="margin:0">Tu plan está vencido. Renuévalo en recepción para registrar tu entrada.</p>':(daily&&!paidToday)?'<p class="muted" style="margin:0">Paga tu pase del día en recepción; allá registran tu entrada.</p>':'<div class="chips"><button class="btn" data-act="scan">Registrar mi entrada con el QR</button></div>'}</div>`; }
function assignedCard(){ const m=CTX&&CTX.member; if(!m||!m.prog||!PROGI[m.prog]) return ''; if(S.program&&S.program.id===m.prog) return ''; if(S.dismissProg===m.prog) return '';
  const p=PROGI[m.prog]; return `<div class="tip" style="display:grid;gap:10px"><span>Tu entrenador te asignó el programa <b>${esc(p.n)}</b> (${LV[p.l]}, ${p.dpw} días por semana).</span><div class="chips"><button class="btn" data-act="takeprog">Empezar este programa</button><button class="btn ghost" data-act="seeprog">Ver programa</button><button class="btn ghost" data-act="skipprog">Ahora no</button></div></div>`; }
let scanner=null, scanBusy=false;
function openScanner(){
  modal(`<div class="sheet-h"><div><div class="eyebrow">Entrada al gimnasio</div><h2>Escanea el QR</h2></div><button class="iconbtn" data-close aria-label="Cerrar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div id="qrReader" style="width:100%;min-height:260px;border-radius:14px;overflow:hidden;background:#000"></div>
    <p class="muted" style="font-size:14px">Apunta la cámara al código de la pantalla de recepción. Si no funciona, pide en recepción que registren tu entrada.</p>
    <div id="scanMsg" class="tip" hidden></div>`,()=>startScan());
}
function scanMsg(t){ const el=document.getElementById('scanMsg'); if(el){ el.textContent=t; el.hidden=false; } }
async function startScan(){ scanBusy=false;
  if(typeof Html5Qrcode==='undefined'){ scanMsg('No se pudo abrir el lector de QR. Pide en recepción que registren tu entrada.'); return }
  try{ scanner=new Html5Qrcode('qrReader'); await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:230,height:230}},txt=>onScan(txt),()=>{}); }
  catch(e){ scanner=null; scanMsg('No pudimos usar la cámara. Permite el acceso a la cámara en el navegador y vuelve a intentar.'); } }
function stopScan(){ if(!scanner) return; const sc=scanner; scanner=null; try{ const r=sc.stop(); if(r&&r.then) r.then(()=>{ try{sc.clear()}catch(e){} }).catch(()=>{}); }catch(e){ try{sc.clear()}catch(_){} } }
async function onScan(txt){ if(scanBusy) return; const parts=String(txt).split('|'); if(parts[0]!=='FORJA'||parts.length<3) return; scanBusy=true;
  if(parts[1]!==CTX.gid){ scanMsg('Este código es de otro gimnasio.'); scanBusy=false; return }
  const {F,gid,mid,uid}=CTX, now=new Date(), d=today(), P=myPlan();
  try{
    await F.fs.setDoc(F.fs.doc(F.db,'gimnasios',gid,'asistencias',mid+'_'+d),{m:mid,d,h:now.getHours(),t:now.getHours()*60+now.getMinutes(),via:'qr',k:parts[2],by:uid,ts:F.fs.serverTimestamp()});
    if(P&&P.ticket&&(P.m.entries||0)>0) await F.fs.updateDoc(F.fs.doc(F.db,'gimnasios',gid,'miembros',mid),{entries:(P.m.entries||0)-1});
    closeModal(); boom(); toast('¡Entrada registrada! A darle 💪');
  }catch(e){ console.error(e); scanMsg(e&&e.code==='permission-denied'?'El código no es válido o no es el de hoy. Escanea el de la pantalla de recepción o pide ayuda allá.':'No se pudo registrar. Revisa tu conexión e intenta de nuevo.'); setTimeout(()=>{scanBusy=false},2500); } }

let mSel=null, fEq=null, fLv=0, q='';
function rMapa(){
  const list = EX.filter(e=>(!mSel||e.m===mSel||e.s.includes(mSel)) && (!fEq||e.eq===fEq) && (!fLv||e.l===fLv) && (!q||(e.n+' '+MUS[e.m]).toLowerCase().includes(q.toLowerCase())))

  const chipsEq = `<button class="chip" data-eq="" aria-pressed="${!fEq}">Todo</button>`+Object.entries(EQ).map(([k,v])=>`<button class="chip" data-eq="${k}" aria-pressed="${fEq===k}">${v}</button>`).join('');
  const chipsLv = [0,1,2,3].map(l=>`<button class="chip" data-lv="${l}" aria-pressed="${fLv===l}">${l?LV[l]:'Todos los niveles'}</button>`).join('');
  $('#v-mapa').innerHTML = `<div class="map-layout">
    <div class="map-sticky card grid">
      <div class="eyebrow">Toca un músculo</div>
      <div class="bodies">
        <figure>${bodySVG({view:'front',sel:mSel,interactive:1})}<figcaption>Frente</figcaption></figure>
        <figure>${bodySVG({view:'back',sel:mSel,interactive:1})}<figcaption>Espalda</figcaption></figure>
      </div>
      <div class="chips">${Object.entries(MUS).map(([k,v])=>`<button class="chip" data-mus="${k}" aria-pressed="${mSel===k}">${v}</button>`).join('')}</div>
    </div>
    <div class="grid" style="min-width:0">
      <div class="sel-title"><h2>${mSel?MUS[mSel]:'Todos los ejercicios'}</h2><span class="muted num">${list.length} ejercicios</span></div>

function progInfo(){ if(!S.program) return null; const p=PROGI[S.program.id]; if(!p) return null;

  S.routine={title:I.p.n+' · '+I.day.n,prog:true,items:I.day.x.map(([id,sets,reps,rest])=>({id,sets,reps,rest}))}; save(); startSession() }

    let pool=EX.filter(e=>e.m===m&&c.eq.includes(e.eq)&&!used.has(e.id));
    if(!pool.length) pool=EX.filter(e=>e.m===m&&e.eq==='corporal'&&!used.has(e.id));
    if(!pool.length) pool=EX.filter(e=>e.m===m&&!used.has(e.id));
    pool=shuffle(pool); const pick = (i<n/2?pool.find(e=>e.c):pool.find(e=>!e.c))||pool[0];
    if(pick){used.add(pick.id); items.push({id:pick.id,sets:pick.c?g[2]:Math.max(3,g[2]-1),reps:g[3],rest:g[4]})}

function lastWeight(id){ for(let i=S.history.length-1;i>=0;i--){const x=S.history[i].log?.find(l=>l.id===id); if(x) return x.kg} return '' }

  x.fillStyle='#fff'; x.font='600 40px Barlow, sans-serif'; x.fillText(h.t.toUpperCase().slice(0,26),70,570);
  const stats=[[fmt(h.vol),'KG LEVANTADOS'],[h.sets,'SERIES'],[h.min+"'",'MINUTOS'],[st,'DÍAS DE RACHA']];
  stats.forEach((s,i)=>{ const cx=70+(i%2)*470, cy=760+Math.floor(i/2)*200; x.fillStyle='#fff'; x.font='900 130px "Big Shoulders Display", Impact, sans-serif'; x.fillText(String(s[0]),cx,cy); x.font='600 26px "IBM Plex Mono", monospace'; x.globalAlpha=.8; x.fillText(s[1],cx,cy+44); x.globalAlpha=1 });
  x.fillStyle=Y; x.beginPath(); x.roundRect?x.roundRect(70,1150,W-140,110,24):x.rect(70,1150,W-140,110); x.fill();
  x.fillStyle=INK; x.font='800 44px Barlow, sans-serif'; x.fillText(`NIVEL ${L} · ${rankName(L).toUpperCase()}`,110,1220);
  x.font='600 28px "IBM Plex Mono", monospace'; x.textAlign='right'; x.fillText('#RETOFORJA',W-110,1218); x.textAlign='left';
  return c.toDataURL('image/png');
}

/* ===================== PROGRESO ===================== */
function rProg(){
  const xp=totalXP(),L=levelOf(xp),a=lvlStart(L),b=lvlStart(L+1),H=S.history.filter(h=>h.sets>0);
  const vol=H.reduce((s,h)=>s+h.vol,0), bs=badges();
  // gráfico 14 días
  const days=[...Array(14)].map((_,i)=>{const d=daysAgo(13-i),k=dkey(d);return {d,v:H.filter(h=>dkey(h.d)===k).reduce((s,h)=>s+h.vol,0)}});
  const max=Math.max(1000,...days.map(d=>d.v)), step=max>8000?5000:2000, top=Math.ceil(max/step)*step;
  const cw=560,ch=200,pl=44,pb=26,bw=(cw-pl)/14;
  let ticks=''; for(let t=0;t<=top;t+=step){const y=ch-pb-(ch-pb-10)*t/top; ticks+=`<line x1="${pl}" x2="${cw}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${t>=1000?t/1000+'k':t}</text>`}
  const bars=days.map((d,i)=>{const h=(ch-pb-10)*d.v/top,x0=pl+i*bw+4,isT=i===13;return `<rect x="${x0}" y="${ch-pb-h}" width="${bw-8}" height="${Math.max(h,d.v?2:0)}" rx="4" fill="${isT?'var(--hi)':'var(--accent)'}"><title>${d.d.toLocaleDateString('es-CO',{weekday:'short',day:'numeric'})}: ${fmt(d.v)} kg</title></rect><text x="${x0+(bw-8)/2}" y="${ch-8}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${d.d.getDate()}</text>`}).join('');
  $('#v-progreso').innerHTML=`
  <div class="card lvl"><div class="badge-lvl num">${L}</div><div style="flex:1;min-width:200px" class="grid"><div><div class="eyebrow">Nivel ${L}</div><h2 style="font-size:42px;font-weight:900">${rankName(L)}</h2></div><div class="bar"><i style="width:${(xp-a)/(b-a)*100}%"></i></div><span class="muted num" style="font-size:13px">${fmt(xp-a)} / ${fmt(b-a)} XP para el nivel ${L+1}</span></div></div>
  <div class="stats">
    <div class="stat"><span class="eyebrow">Sesiones</span><b>${H.length}</b></div>
    <div class="stat"><span class="eyebrow">Kg totales</span><b class="num" style="font-size:34px">${fmt(vol)}</b></div>
    <div class="stat"><span class="eyebrow">Racha</span><b>${streak()}</b><span class="muted">días</span></div>
    <div class="stat"><span class="eyebrow">XP total</span><b class="num" style="font-size:34px">${fmt(xp)}</b></div>
  </div>
  <div class="card grid"><div class="sel-title"><div><div class="eyebrow">Últimos 14 días</div><h3 style="font-size:28px">Volumen levantado</h3></div><span class="muted" style="font-size:13px">kg por día · hoy en amarillo</span></div>
    <div style="overflow-x:auto"><svg viewBox="0 0 ${cw} ${ch}" style="width:100%;min-width:420px;height:auto" role="img" aria-label="Volumen por día">${ticks}${bars}</svg></div></div>
  <div class="card grid"><div><div class="eyebrow">${bs.filter(b=>b[3]).length} de ${bs.length}</div><h3 style="font-size:28px">Logros</h3></div>
    <div class="badges">${bs.map(b=>`<div class="bdg ${b[3]?'got':''}"><div class="ico">${b[0]}</div><b>${b[1]}</b><small>${b[2]}</small></div>`).join('')}</div></div>
  <div class="two" style="align-items:start">
    <div class="card"><div class="eyebrow">Historial</div><div class="hist">${S.history.slice().reverse().slice(0,10).map(h=>`<div class="hrow"><span class="d">${new Date(h.d).toLocaleDateString('es-CO',{day:'2-digit',month:'short'})}</span><span style="min-width:0"><b>${esc(h.t)}</b>${h.demo?' <span class="tag">ejemplo</span>':''}<br><span class="muted" style="font-size:13px">${h.sets?h.sets+' series · '+h.min+' min':'Reto diario'}</span></span><span class="num" style="font-size:13px">${h.vol?fmt(h.vol)+' kg':'+'+h.xp+' XP'}</span></div>`).join('')||'<div class="empty">Aún no hay sesiones.</div>'}</div></div>
    <div class="card grid"><div class="eyebrow">Tu perfil</div>
      <label>Nombre<input class="inp" id="pName" value="${esc(S.name)}" maxlength="24"></label>
      <label>Gimnasio<input class="inp" value="${esc(S.gym)}" disabled></label>
      <button class="btn ghost" id="pOut">Cerrar sesión</button></div>
  </div>`;
  $('#pName').onchange=e=>{S.name=e.target.value.trim()||'Atleta';save();header()};
  $('#pOut').onclick=()=>CTX&&CTX.F.logout();
}
$('#topOut').onclick=()=>{
  modal(`<div class="sheet-h"><h2>¿Cerrar sesión?</h2><button class="iconbtn" data-close aria-label="Cancelar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
   <p class="muted" style="margin:0 0 14px">Tu progreso queda guardado. Para volver, entra con tu correo y tu contraseña.</p>
   <div class="chips"><button class="btn" id="outYes">Cerrar sesión</button><button class="btn ghost" data-close>Cancelar</button></div>`,
  sc=>sc.querySelector('#outYes').onclick=()=>{ if(CTX) CTX.F.logout(); else location.replace('index.html') });
}

/* ===================== RANKING ===================== */
async function loadRank(){ const {F,gid}=CTX, wk=weekKey(Date.now());
  const qs=await F.fs.getDocs(F.fs.query(F.fs.collection(F.db,'gimnasios',gid,'ranking'),F.fs.where('week','==',wk)));
  CTX.rank=qs.docs.map(d=>({id:d.id,...d.data()})); CTX.rankAt=Date.now(); }
function rRank(){
  if(!CTX) return;
  if(!CTX.rank||Date.now()-CTX.rankAt>60000){ if(!CTX.rank) $('#v-ranking').innerHTML='<div class="empty">Cargando el ranking…</div>'; loadRank().then(()=>{ if(tab==='ranking') rRankDraw() }).catch(e=>{ err(e) }); if(!CTX.rank) return; }
  rRankDraw();
}
function rRankDraw(){
  const wk=weekKey(Date.now()), myXP=S.history.filter(h=>weekKey(h.d)===wk).reduce((a,h)=>a+(h.xp||0),0);
  const hue=n=>{let h=0;for(const c of String(n))h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} 55% 45%)`};
  const rows=[...CTX.rank.filter(r=>r.id!==CTX.mid).map(r=>({n:r.n||'Atleta',xp:r.xpWeek||0,lvl:r.lvl||1,c:hue(r.n)})),{n:(S.name||'Tú')+' (tú)',xp:myXP,lvl:levelOf(totalXP()),c:'var(--accent)',me:1}].sort((a,b)=>b.xp-a.xp);
  const me=rows.findIndex(r=>r.me), ahead=rows[me-1];
  const ini=n=>String(n).replace(/\s*\(tú\)/,'').split(' ').filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const p=rows.length>=3?[rows[1],rows[0],rows[2]]:null;
  const monthVisits=CTX.myVisits.filter(v=>v.d.slice(0,7)===today().slice(0,7)).length;
  const retos=(CTX.retos||[]).map(r=>{ const v=r.tipo==='visitas'?monthVisits:streak(); const left=Math.round((new Date(r.fin+'T12:00')-new Date(today()+'T12:00'))/864e5);
    return `<div class="card grid" style="gap:8px"><div class="sel-title"><div><div class="eyebrow">Reto del gimnasio · ${r.tipo==='visitas'?'visitas en el mes':'días seguidos'}</div><h3 style="font-size:26px">${esc(r.n)}</h3></div><span class="tag">${left>0?'Faltan '+left+' días':'Terminado'}</span></div>
      <div class="bar hi"><i style="width:${Math.min(100,v/r.meta*100)}%"></i></div><span class="num" style="font-size:13px">${v} de ${r.meta}${v>=r.meta?' · ¡Cumpliste!':''}</span><span class="muted" style="font-size:13px">🏆 ${esc(r.premio||'')}</span></div>`; }).join('');
  $('#v-ranking').innerHTML=`
  ${retos}
  <div class="card grid"><div class="sel-title"><div><div class="eyebrow">${esc(S.gym)} · esta semana</div><h2 style="font-size:44px;font-weight:900">Ranking del gym</h2></div><span class="tag">${rows.length} ${rows.length===1?'atleta':'atletas'}</span></div>
    ${p?`<div class="podium">${p.map((r,i)=>`<div style="height:${[150,190,125][i]}px;${r.me?'background:var(--hi);color:var(--hi-ink)':''}"><span class="av" style="background:${r.c}">${ini(r.n)}</span><b>${esc(r.n)}</b><span class="num" style="font-size:12px">${fmt(r.xp)} XP</span><span style="font-family:var(--f-display);font-weight:900;font-size:28px;line-height:1">${[2,1,3][i]}</span></div>`).join('')}</div>`:''}
    ${rows.length===1?`<div class="tip">Por ahora eres el único en el ranking de esta semana. Invita a tus compañeros del gym a competir.</div>`:ahead?`<div class="tip">Estás en el puesto ${me+1}. Te faltan <b>${fmt(ahead.xp-myXP+1)} XP</b> para pasar a ${esc(ahead.n)}: unas ${Math.max(1,Math.ceil((ahead.xp-myXP+1)/200))} sesiones.</div>`:`<div class="tip">Eres el número 1 de ${esc(S.gym)} esta semana. Defiende el puesto.</div>`}
    <div class="rank">${rows.map((r,i)=>`<div class="rrow ${r.me?'me':''}"><span class="pos">${i+1}</span><span class="av" style="background:${r.c}">${ini(r.n)}</span><span><b>${esc(r.n)}</b><br><span class="muted" style="font-size:12px">Nivel ${r.lvl}</span></span><span class="num">${fmt(r.xp)} XP</span></div>`).join('')}</div>
    <div class="chips"><button class="btn hi" id="invite" style="flex:1">Invitar a un amigo</button></div>
    <p class="muted" style="font-size:13px;margin:0">El ranking se reinicia cada lunes. Ganas XP por serie, por sesión, por mantener la racha y por los retos diarios.</p>
  </div>`;
  $('#invite').onclick=()=>copy(`Entreno en ${S.gym} con FORJA y voy #${me+1} en el ranking semanal 🏆 Ven a entrenar conmigo. #RetoForja`);
}

/* ===================== CONFETI ===================== */
function boom(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=$('#confetti'); c.hidden=false; c.width=innerWidth; c.height=innerHeight; const x=c.getContext('2d');
  const cols=[cssVar('--accent'),cssVar('--hi'),cssVar('--heat'),'#ffffff'];
  const P=[...Array(140)].map(()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,r:Math.random()*6+4,c:cols[Math.floor(Math.random()*4)],a:Math.random()*6}));
  let f=0; (function loop(){ x.clearRect(0,0,c.width,c.height); P.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
    if(++f<110) requestAnimationFrame(loop); else {x.clearRect(0,0,c.width,c.height); c.hidden=true} })();
}

render();
boot();
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
